<!doctype html>
{# Показва се от service worker-а, когато няма интернет. Без външни файлове – всичко е тук. #}
<html lang="bg">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Няма връзка – Questboard</title>
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1.5rem;
           font-family: system-ui, "Segoe UI", sans-serif; background: #f7f7f5; color: #16181d; text-align: center; }
    @media (prefers-color-scheme: dark) { body { background: #121316; color: #eceef1; } }
    h1 { font-size: 1.6rem; margin: 0 0 0.5rem; }
    p { margin: 0 0 1.5rem; opacity: 0.75; }
    button { font: inherit; font-weight: 600; padding: 0.7rem 1.4rem; border: 0; border-radius: 4px;
             background: #c8102e; color: #fff; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <h1>Няма връзка с интернет</h1>
    <p>Questboard има нужда от интернет. Опитай пак, когато връзката се върне.</p>
    <button type="button" onclick="location.reload()">Опитай пак</button>
  </main>
</body>
</html>
