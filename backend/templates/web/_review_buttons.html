{# Бутони „Потвърди“ / „Откажи“ за заявка. Очаква claim; след действието се връща на същата страница. #}
<form method="post" action="{% url 'review_claim' claim.pk %}" class="review-form">
  {% csrf_token %}
  <input type="hidden" name="next" value="{{ request.get_full_path }}">
  <input type="text" name="comment" maxlength="500" placeholder="Коментар към ученика (по желание)" aria-label="Коментар към ученика">
  <button type="submit" name="decision" value="approve" class="btn-small">Потвърди</button>
  <button type="submit" name="decision" value="reject" class="btn-danger btn-small">Откажи</button>
</form>
