{# Две страници под една точка от менюто. Очаква tabs: „guilds“ или „rewards“. #}
<nav class="segmented page-tabs" aria-label="Страници">
  {% with page=request.resolver_match.url_name %}
  {% if tabs == "guilds" %}
    <a href="{% url 'guild_list' %}" {% if page == "guild_list" %}aria-current="page"{% endif %}>Гилдии</a>
    <a href="{% url 'test_list' %}" {% if page == "test_list" %}aria-current="page"{% endif %}>Тестове</a>
  {% else %}
    <a href="{% url 'purchase_list' %}" {% if page == "purchase_list" %}aria-current="page"{% endif %}>За предаване</a>
    <a href="{% url 'rewards' %}" {% if page == "rewards" %}aria-current="page"{% endif %}>Бонус и значка</a>
  {% endif %}
  {% endwith %}
</nav>
