{% load static %}<!doctype html>
<html lang="bg">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Грешка{% endblock %} – Questboard</title>
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
  {# Страница за грешка: проста, без меню и без заявки към базата, за да се покаже винаги. #}
  <header class="topbar"><a class="brand" href="/">Questboard</a></header>
  <main class="page">
    <section class="card error-card">
      <p class="error-code">{% block code %}{% endblock %}</p>
      <h1>{% block heading %}{% endblock %}</h1>
      <p>{% block text %}{% endblock %}</p>
      <a class="button" href="/">Към началото</a>
    </section>
  </main>
</body>
</html>
