# Пуска всички тестове при всяко качване в GitHub и при всяка заявка за сливане.
name: Тестове

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      # Тестови стойности – истинските тайни никога не са в хранилището.
      DJANGO_SECRET_KEY: ci-only-test-key
      ASSISTANT_TOKEN: ci-only-test-token
      DB_ENGINE: sqlite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python run_tests.py
